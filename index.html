<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Donasi • Golden Hour</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: linear-gradient(145deg, #f9d976 0%, #f39c6d 40%, #e67e5a 100%);
      background-attachment: fixed;
    }

    .card-container {
      max-width: 480px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* GLASSMORPHISM CARD - BLUR LEBIH KUAT */
    .card {
      background: rgba(255, 245, 220, 0.15);
      backdrop-filter: blur(24px) saturate(200%);
      -webkit-backdrop-filter: blur(24px) saturate(200%);
      border-radius: 36px;
      padding: 24px 20px;
      border: 1px solid rgba(255, 215, 140, 0.5);
      box-shadow: 0 20px 40px -12px rgba(120, 60, 20, 0.35), inset 0 1px 0 rgba(255, 235, 200, 0.6);
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
    }

    /* CARD 1 : VIDEO LOOP */
    .video-card {
      padding: 12px;
      background: rgba(20, 15, 10, 0.5);
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      border: 1px solid rgba(255, 200, 120, 0.4);
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      border-radius: 24px;
      overflow: hidden;
      background: #1a1008;
    }

    .video-wrapper video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* CARD 2 : DONASI QRIS */
    .donasi-card {
      text-align: center;
      padding: 28px 20px 24px;
      background: rgba(255, 235, 200, 0.12);
      backdrop-filter: blur(24px) saturate(200%);
      -webkit-backdrop-filter: blur(24px) saturate(200%);
      border: 1px solid rgba(255, 200, 130, 0.4);
    }

    .mau-macha {
      display: block;
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #2e7d32;
      margin-bottom: 4px;
      line-height: 1.2;
      text-shadow: 0 2px 12px rgba(46, 125, 50, 0.15);
    }

    .sub-jajan {
      display: block;
      font-size: 0.95rem;
      font-weight: 500;
      color: #f5e6d3;
      margin: 0 auto 20px auto;
      letter-spacing: 0.3px;
      background: rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 10px 18px;
      border-radius: 40px;
      border: 1px solid rgba(255, 215, 140, 0.2);
      max-width: 90%;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }

    .btn-donasi {
      background: linear-gradient(135deg, #f5a623, #e07b3a);
      border: none;
      padding: 18px 40px;
      border-radius: 80px;
      color: #2d1a0a;
      font-weight: 700;
      font-size: 1.5rem;
      letter-spacing: 1px;
      box-shadow: 0 12px 28px -8px rgba(200, 100, 20, 0.4);
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
      max-width: 280px;
      border: 1px solid rgba(255, 220, 160, 0.5);
      display: inline-block;
      text-decoration: none;
      color: #2d1a0a;
    }

    .btn-donasi:active {
      transform: scale(0.94);
      box-shadow: 0 4px 12px rgba(180, 80, 20, 0.3);
    }

    /* CARD 3 : JOIN MEMBER */
    .join-card {
      text-align: center;
      padding: 32px 20px 28px;
      background: rgba(255, 235, 200, 0.1);
      backdrop-filter: blur(24px) saturate(200%);
      -webkit-backdrop-filter: blur(24px) saturate(200%);
      border: 1px solid rgba(255, 200, 130, 0.35);
    }

    .join-title {
      display: block;
      font-size: 1.9rem;
      font-weight: 700;
      color: #f5e6d3;
      line-height: 1.3;
      margin-bottom: 8px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .join-sub {
      display: block;
      font-size: 0.95rem;
      color: #f0e0c8;
      margin: 0 auto 28px auto;
      letter-spacing: 0.2px;
      background: rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 8px 16px;
      border-radius: 60px;
      border: 1px solid rgba(255, 200, 120, 0.15);
      max-width: 90%;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
    }

    .btn-join {
      background: #5865f2;
      border: none;
      padding: 18px 32px;
      border-radius: 60px;
      color: white;
      font-weight: 600;
      font-size: 1.3rem;
      box-shadow: 0 10px 24px -4px #5865f266;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
      max-width: 280px;
      display: inline-block;
      text-decoration: none;
      letter-spacing: 0.5px;
      border: 1px solid #7984f5;
    }

    .btn-join:active {
      transform: scale(0.94);
      background: #4752c4;
      box-shadow: 0 4px 12px #5865f266;
    }

    /* CARD 4 : SOSIAL MEDIA (INSTAGRAM) */
    .sosmed-card {
      text-align: center;
      padding: 32px 20px 28px;
      background: rgba(255, 235, 200, 0.1);
      backdrop-filter: blur(24px) saturate(200%);
      -webkit-backdrop-filter: blur(24px) saturate(200%);
      border: 1px solid rgba(255, 200, 130, 0.35);
    }

    .sosmed-title {
      display: block;
      font-size: 1.9rem;
      font-weight: 700;
      color: #f5e6d3;
      line-height: 1.3;
      margin-bottom: 8px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .sosmed-sub {
      display: block;
      font-size: 0.95rem;
      color: #f0e0c8;
      margin: 0 auto 28px auto;
      letter-spacing: 0.2px;
      background: rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 8px 16px;
      border-radius: 60px;
      border: 1px solid rgba(255, 200, 120, 0.15);
      max-width: 90%;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
    }

    .btn-instagram {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      border: none;
      padding: 18px 32px;
      border-radius: 60px;
      color: white;
      font-weight: 600;
      font-size: 1.3rem;
      box-shadow: 0 10px 24px -4px rgba(220, 39, 67, 0.4);
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
      max-width: 280px;
      display: inline-block;
      text-decoration: none;
      letter-spacing: 0.5px;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .btn-instagram:active {
      transform: scale(0.94);
      background: linear-gradient(45deg, #d6812a 0%, #cc5a34 25%, #c01f38 50%, #b31d59 75%, #a31576 100%);
      box-shadow: 0 4px 12px rgba(220, 39, 67, 0.3);
    }

    .footer-note {
      text-align: center;
      font-size: 0.85rem;
      color: #f5e6d3;
      letter-spacing: 0.5px;
      margin-top: 8px;
      opacity: 0.9;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.3);
      padding: 8px 0;
    }
  </style>
</head>
<body>
  <div class="card-container">
    <!-- CARD 1 : Video autoplay & loop -->
    <div class="card video-card">
      <div class="video-wrapper">
        <video autoplay muted playsinline loop>
          <source src="https://files.catbox.moe/93nqf5.mp4" type="video/mp4">
          <p>Video tidak dapat diputar, periksa koneksi.</p>
        </video>
      </div>
    </div>

    <!-- CARD 2 : Donasi + QRIS -->
    <div class="card donasi-card">
      <span class="mau-macha">Mau Macha~🧋</span>
      <span class="sub-jajan">✨ Berikan jajan biar lebih semangat ngonten! 🍭</span>
      <a href="qris.html" class="btn-donasi">🍬 Berikan Jajan!</a>
    </div>

    <!-- CARD 3 : Join Member (Discord) -->
    <div class="card join-card">
      <span class="join-title">✨ Join Discord Kami</span>
      <span class="join-sub">🌟 gabung komunitas, dapatkan update & ngobrol seru!</span>
      <a href="join.html" class="btn-join">🎮 Join Discord</a>
    </div>

    <!-- CARD 4 : Sosial Media (Instagram) -->
    <div class="card sosmed-card">
      <span class="sosmed-title">📸 Follow Instagram Kami</span>
      <span class="sosmed-sub">🌈 update konten & keseruan lainnya di Instagram!</span>
      <a href="https://www.instagram.com/kroketfun.zy?stkn=aWh3dGNkazRobzB4" target="_blank" rel="noopener noreferrer" class="btn-instagram">📷 Follow Instagram</a>
    </div>

    <div class="footer-note">🧡 terima kasih atas dukungannya 🐾</div>
  </div>
</body>
</html>
