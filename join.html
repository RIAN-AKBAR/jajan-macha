<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Join Discord • Golden Hour</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: linear-gradient(145deg, #f9d976 0%, #f39c6d 40%, #e67e5a 100%);
      background-attachment: fixed;
    }

    .join-page-card {
      background: rgba(255, 245, 220, 0.1);
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      border-radius: 48px;
      padding: 40px 28px 34px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(255, 215, 140, 0.4);
      box-shadow: 0 30px 50px -10px rgba(120, 60, 20, 0.3), inset 0 1px 0 rgba(255, 235, 200, 0.4);
    }

    .join-page-title {
      display: block;
      font-size: 2.2rem;
      font-weight: 700;
      color: #f5e6d3;
      line-height: 1.2;
      margin-bottom: 8px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
    }

    .join-page-sub {
      display: block;
      color: #f0e0c8;
      font-size: 0.95rem;
      margin: 0 auto 32px auto;
      background: rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 10px 18px;
      border-radius: 60px;
      border: 1px solid rgba(255, 200, 120, 0.15);
      max-width: 90%;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
    }

    .btn-discord {
      background: #5865f2;
      border: none;
      padding: 18px 32px;
      border-radius: 60px;
      color: white;
      font-weight: 600;
      font-size: 1.4rem;
      box-shadow: 0 12px 28px -6px #5865f266;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
      max-width: 280px;
      display: inline-block;
      text-decoration: none;
      border: 1px solid #7b89f5;
      margin: 4px 0;
    }

    .btn-discord:active {
      transform: scale(0.94);
      background: #4752c4;
      box-shadow: 0 4px 12px #5865f266;
    }

    .back-link {
      display: inline-block;
      margin-top: 24px;
      color: #f0e0c8;
      text-decoration: none;
      font-size: 0.95rem;
      border-bottom: 1px dashed rgba(255, 215, 140, 0.4);
      padding-bottom: 3px;
      font-weight: 500;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body>
  <div class="join-page-card">
    <span class="join-page-title">🌟 Join Discord Kami</span>
    <span class="join-page-sub">🌟 gabung komunitas, dapatkan update & ngobrol seru!</span>
    <a href="https://discord.gg/tZgKS2RdJ" class="btn-discord" target="_blank">🎮 Join Discord</a>
    <br>
    <a href="index.html" class="back-link">← Kembali ke donasi</a>
  </div>
</body>
</html>
