<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>QRIS Donasi • Golden Hour</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: linear-gradient(145deg, #f9d976 0%, #f39c6d 40%, #e67e5a 100%);
      background-attachment: fixed;
    }

    .qris-wrapper {
      max-width: 420px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .qris-card {
      background: rgba(255, 245, 220, 0.12);
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      border-radius: 48px;
      padding: 32px 24px 28px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(255, 215, 140, 0.45);
      box-shadow: 0 30px 50px -20px rgba(120, 60, 20, 0.35), inset 0 1px 0 rgba(255, 235, 200, 0.5);
      transition: all 0.3s ease;
    }

    .qris-title {
      display: block;
      font-size: 2rem;
      font-weight: 700;
      color: #f5e6d3;
      margin-bottom: 16px;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
    }

    .qris-image {
      width: 100%;
      max-width: 280px;
      height: auto;
      aspect-ratio: 1/1;
      object-fit: contain;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 12px;
      margin: 0 auto 20px auto;
      display: block;
      border: 2px solid rgba(255, 215, 140, 0.2);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    .btn-download {
      background: linear-gradient(135deg, #f5a623, #e07b3a);
      border: none;
      padding: 16px 28px;
      border-radius: 60px;
      color: #2d1a0a;
      font-weight: 600;
      font-size: 1.2rem;
      box-shadow: 0 10px 20px -6px rgba(180, 90, 20, 0.35);
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
      max-width: 240px;
      display: inline-block;
      text-decoration: none;
      border: 1px solid rgba(255, 220, 160, 0.5);
      margin: 4px 0;
    }

    .btn-download:active {
      transform: scale(0.94);
      background: #d4893a;
      box-shadow: 0 4px 12px rgba(160, 70, 20, 0.25);
    }

    .btn-download:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: #f0e0c8;
      text-decoration: none;
      font-size: 0.95rem;
      border-bottom: 1px dashed rgba(255, 215, 140, 0.4);
      padding-bottom: 3px;
      font-weight: 500;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
    }

    /* CARD TERIMA KASIH - muncul setelah download */
    .thankyou-card {
      background: rgba(46, 125, 50, 0.15);
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      border-radius: 48px;
      padding: 28px 24px;
      width: 100%;
      text-align: center;
      border: 2px solid rgba(46, 125, 50, 0.4);
      box-shadow: 0 20px 40px -12px rgba(46, 125, 50, 0.2);
      animation: fadeSlideUp 0.5s ease forwards;
      display: none;
    }

    .thankyou-card.show {
      display: block;
    }

    .thankyou-icon {
      font-size: 3.5rem;
      display: block;
      margin-bottom: 8px;
    }

    .thankyou-title {
      display: block;
      font-size: 1.8rem;
      font-weight: 700;
      color: #f5e6d3;
      margin-bottom: 6px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
    }

    .thankyou-sub {
      display: block;
      font-size: 1rem;
      color: #f0e0c8;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
    }

    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="qris-wrapper">
    <!-- QRIS CARD -->
    <div class="qris-card" id="qrisCard">
      <span class="qris-title">💳 QRIS</span>
      <img src="https://files.catbox.moe/2v77ug.jpeg" alt="QRIS" class="qris-image" id="qrisImage">
      <a href="#" id="downloadQrisBtn" class="btn-download">⬇ Download QRIS</a>
      <br>
      <a href="index.html" class="back-link">← Kembali ke donasi</a>
    </div>

    <!-- THANK YOU CARD -->
    <div class="thankyou-card" id="thankyouCard">
      <span class="thankyou-icon">🎉</span>
      <span class="thankyou-title">Terima Kasih! 🧡</span>
      <span class="thankyou-sub">Aku akan melakukan yang terbaik untuk konten selanjutnya! 🍵</span>
    </div>
  </div>

  <script>
    document.getElementById('downloadQrisBtn').addEventListener('click', function(e) {
      e.preventDefault();
      const img = document.getElementById('qrisImage');
      const imgSrc = img.src;
      const btn = this;
      const thankyouCard = document.getElementById('thankyouCard');
      const qrisCard = document.getElementById('qrisCard');
      
      // Disable button agar tidak diklik ganda
      btn.disabled = true;
      btn.textContent = '⏳ Mengunduh...';

      function showThankYou() {
        // Sembunyikan QRIS card dengan animasi
        qrisCard.style.transition = 'all 0.4s ease';
        qrisCard.style.opacity = '0';
        qrisCard.style.transform = 'scale(0.95)';
        
        setTimeout(() => {
          qrisCard.style.display = 'none';
          // Tampilkan card terima kasih
          thankyouCard.classList.add('show');
        }, 400);
      }

      function downloadImage(url) {
        // Buat link download
        const link = document.createElement('a');
        link.href = url;
        link.download = 'qris.png';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        
        // Tampilkan card terima kasih setelah download
        setTimeout(showThankYou, 500);
      }

      // Coba fetch dulu untuk dapatkan blob
      fetch(imgSrc)
        .then(res => {
          if (!res.ok) throw new Error('Gagal fetch');
          return res.blob();
        })
        .then(blob => {
          const url = URL.createObjectURL(blob);
          downloadImage(url);
          // Revoke URL setelah beberapa detik
          setTimeout(() => URL.revokeObjectURL(url), 5000);
        })
        .catch(() => {
          // Fallback: download langsung dari src
          downloadImage(imgSrc);
        });
    });
  </script>
</body>
</html>
